name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        run: node --test "test/*.test.js"
      - name: Read launcher pin
        id: launcher
        shell: pwsh
        run: |
          $pin = Get-Content launcher/UPSTREAM.txt -Raw
          if ($pin -notmatch '(?m)^SHA: ([a-f0-9]{40})\r?$') { throw 'Missing pinned launcher SHA' }
          "sha=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Keep upstream line endings
        run: git config --global core.autocrlf false
      - name: Checkout pinned launcher
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: ${{ steps.launcher.outputs.sha }}
          path: upstream-launcher
          sparse-checkout: launcher
          persist-credentials: false
      - name: Apply CleanTV launcher patches
        shell: pwsh
        run: |
          # Upstream moves on; the pin only changes together with a patch that still applies to it.
          foreach ($patch in Get-ChildItem launcher/patches/*.patch | Sort-Object Name) {
            git -C upstream-launcher apply --check $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Launcher patch $($patch.Name) does not apply to the pinned upstream SHA. Rebase it, then update launcher/UPSTREAM.txt." }
            git -C upstream-launcher apply $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Applying launcher patch $($patch.Name) failed." }
          }
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        shell: pwsh
        run: |
          # Use Google's SDK supplied by the official GitHub Windows runner.
          if (-not $env:ANDROID_HOME) { throw 'Android SDK missing on runner' }
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-34' 'build-tools;34.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK setup failed' }
      - name: Build signed CleanTV Home
        shell: pwsh
        env:
          LAUNCHER_KEYSTORE_B64: ${{ secrets.LAUNCHER_KEYSTORE_B64 }}
          LAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_KEYSTORE_PASSWORD }}
          LAUNCHER_KEY_ALIAS: ${{ secrets.LAUNCHER_KEY_ALIAS }}
          LAUNCHER_KEY_PASSWORD: ${{ secrets.LAUNCHER_KEY_PASSWORD }}
        run: |
          foreach ($name in @('LAUNCHER_KEYSTORE_B64', 'LAUNCHER_KEYSTORE_PASSWORD', 'LAUNCHER_KEY_ALIAS', 'LAUNCHER_KEY_PASSWORD')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing GitHub signing secret: $name. See docs/RELEASE.md. No debug key fallback." }
          }
          $env:LAUNCHER_KEYSTORE_PATH = Join-Path $env:RUNNER_TEMP 'cleantv-launcher.jks'
          try {
            [IO.File]::WriteAllBytes($env:LAUNCHER_KEYSTORE_PATH, [Convert]::FromBase64String($env:LAUNCHER_KEYSTORE_B64))
            node scripts/prepare-launcher.js upstream-launcher/launcher
            if ($LASTEXITCODE -ne 0) { throw 'Launcher build preparation failed' }
            Push-Location upstream-launcher/launcher
            try {
              .\gradlew.bat --no-daemon -PlauncherApplicationId=io.github.sepulse.cleantv.home testDebugUnitTest --tests '*PrayerTimesTest' assembleRelease
              if ($LASTEXITCODE -ne 0) { throw 'Signed launcher build failed' }
            } finally { Pop-Location }
            $apk = 'upstream-launcher/launcher/app/build/outputs/apk/release/app-release.apk'
            & "$env:ANDROID_HOME/build-tools/34.0.0/apksigner.bat" verify --verbose $apk
            if ($LASTEXITCODE -ne 0) { throw 'Release APK signature verification failed' }
            Copy-Item -LiteralPath $apk -Destination launcher/cleantv-home.apk
          } finally {
            if (Test-Path -LiteralPath $env:LAUNCHER_KEYSTORE_PATH) { Remove-Item -LiteralPath $env:LAUNCHER_KEYSTORE_PATH -Force }
          }
      - name: Build lite portable zip
        run: node scripts/build-portable.js
      - name: Attest zip and APK
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/CleanTV-win-x64.zip
            dist/cleantv-home.apk
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/CleanTV-win-x64.zip
            dist/SHA256SUMS.txt
            dist/cleantv-home.apk
